[package]
name = "srev"
version = "1.0.0"
edition = "2024"
description = "A terminal code and diff viewer specialized for reading code"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/ore-public/srev"
keywords = ["tui", "git", "diff", "code-review", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.102"
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
ignore = "0.4.26"
lsp-types = "=0.94.1"
nucleo-matcher = "0.3.1"
ratatui = "0.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
toml = "1.1.2"
tree-sitter = "0.23"
tree-sitter-c = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-tags = "0.23"
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
